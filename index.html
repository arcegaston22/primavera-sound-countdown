<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Primavera Sound · Gorillaz + The Strokes · 28-29 de noviembre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root {
  --coal: #0d0f14;
  --night: #161a26;
  --neon: #9dff2e;
  --purple: #7a2cff;
  --red: #ff2a2a;
  --bone: #f1ead8;
  --dim: #8b8f9c;
  --display: 'Bowlby One', 'Arial Black', Impact, sans-serif;
  --type: 'Special Elite', 'Courier New', Courier, monospace;
  box-sizing: border-box;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* MODOS VISUALES (IDEA 6) */
body[data-theme="kong"] {
  --coal: #050a04;
  --night: #0b1709;
  --neon: #b4ff39;
  --purple: #9d4edd;
  --red: #00f5d4;
  --bone: #e2f1d5;
}
body[data-theme="kong"]::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 60;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,0.38) 0px, rgba(0,0,0,0.38) 2px, transparent 2px, transparent 4px);
}
body[data-theme="nyc"] {
  --coal: #050505;
  --night: #121212;
  --neon: #ffffff;
  --purple: #ff2a2a;
  --red: #ff2a2a;
  --bone: #f7f4eb;
  filter: contrast(1.08);
}

*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: 4rem; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--coal);
  color: var(--bone);
  font-family: var(--type);
  font-size: 1.05rem;
  line-height: 1.55;
  overflow-x: hidden;
  transition: background .3s, color .3s;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 50;
  opacity: .12;
  background: radial-gradient(circle, #fff 0 .6px, transparent .8px) 0 0/5px 5px;
}
button, input, select { font: inherit; color: inherit; touch-action: manipulation; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--neon); outline-offset: 3px; }
section { padding: clamp(2.8rem, 7vw, 5.5rem) clamp(1rem, 5vw, 4rem); max-width: 1200px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: .95; margin: 0; }
h2 { font-size: clamp(2rem, 6vw, 3.8rem); margin-bottom: 1.2rem; }
p { max-width: 65ch; }

/* BARRA SUPERIOR DE NAVEGACIÓN Y TEMAS */
.topbar {
  position: sticky;
  top: 0;
  z-index: 55;
  background: rgba(13, 15, 20, 0.92);
  backdrop-filter: blur(8px);
  border-bottom: 2px solid var(--bone);
  padding: .6rem clamp(1rem, 4vw, 2.5rem);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
}
.nav-links { display: flex; gap: .8rem; flex-wrap: wrap; font-size: .85rem; }
.nav-links a { color: var(--bone); text-decoration: none; padding: .2rem .5rem; border: 1px solid transparent; }
.nav-links a:hover { border-color: var(--neon); color: var(--neon); }
.theme-switch { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; }
.theme-btn {
  background: var(--night);
  border: 2px solid var(--bone);
  padding: .3rem .65rem;
  font-size: .78rem;
  transition: transform .15s, background .15s;
}
.theme-btn[aria-pressed="true"] { background: var(--neon); color: var(--coal); border-color: var(--neon); font-weight: bold; }

/* HERO */
.hero { min-height: 92svh; display: flex; flex-direction: column; justify-content: center; gap: 1.5rem; position: relative; }
.date {
  font-size: clamp(2.6rem, 13vw, 10rem);
  white-space: nowrap;
  line-height: .85;
  letter-spacing: -.04em;
  color: var(--bone);
  position: relative;
  display: inline-block;
  margin: 0;
}
.date span { color: var(--red); }
.glitch { position: relative; }
.glitch::before, .glitch::after { content: attr(data-t); position: absolute; inset: 0; pointer-events: none; }
.glitch::before { color: var(--neon); clip-path: inset(0 0 60% 0); transform: translateX(-4px); animation: gl1 4.5s steps(1) infinite; }
.glitch::after { color: var(--purple); clip-path: inset(55% 0 0 0); transform: translateX(4px); animation: gl2 4.5s steps(1) infinite; }
@keyframes gl1 { 0%, 90%, 100% { opacity: 0; } 91% { opacity: 1; transform: translate(-6px, 2px); } 94% { opacity: 1; transform: translate(3px, -2px); } 96% { opacity: 0; } }
@keyframes gl2 { 0%, 92%, 100% { opacity: 0; } 93% { opacity: 1; transform: translate(6px, -2px); } 97% { opacity: 0; } }
.lead { font-size: clamp(1.05rem, 2.4vw, 1.5rem); }
.lead b { background: var(--neon); color: var(--coal); padding: 0 .3em; font-weight: 400; }
.lead i { font-style: normal; border-bottom: 3px solid var(--red); }
.neon { font-family: var(--display); color: var(--neon); text-shadow: 0 0 12px rgba(157, 255, 46, .7); animation: flick 6s infinite; }
@keyframes flick { 0%, 18%, 22%, 62%, 100% { opacity: 1; } 20%, 60% { opacity: .35; } 21% { opacity: .9; } }
.clock { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(.4rem, 2vw, 1.2rem); max-width: 900px; }
.cell {
  background: var(--bone);
  color: var(--coal);
  padding: .8rem .3rem 1rem;
  text-align: center;
  transform: rotate(-1.2deg);
  position: relative;
  clip-path: polygon(0 4%, 6% 0, 14% 3%, 30% 0, 48% 4%, 66% 0, 84% 3%, 100% 0, 100% 96%, 92% 100%, 70% 97%, 48% 100%, 24% 96%, 0 100%);
}
.cell:nth-child(even) { transform: rotate(1deg); background: var(--neon); }
.cell:nth-child(3) { background: var(--red); color: var(--bone); }
.num { font-family: var(--display); font-size: clamp(1.8rem, 9.5vw, 6rem); display: block; line-height: 1; }
.num.tick { animation: pulse .5s ease-out; }
@keyframes pulse { 0% { transform: scale(1.25) rotateX(80deg); opacity: .2; } 60% { transform: scale(.96); } 100% { transform: none; opacity: 1; } }
.lab { font-size: clamp(.65rem, 2vw, 1rem); display: block; margin-top: .2rem; }
.stagger > * { opacity: 0; transform: translateY(24px); animation: rise .7s cubic-bezier(.2, .8, .2, 1) forwards; }
.stagger > *:nth-child(1) { animation-delay: .1s; }
.stagger > *:nth-child(2) { animation-delay: .25s; }
.stagger > *:nth-child(3) { animation-delay: .4s; }
.stagger > *:nth-child(4) { animation-delay: .55s; }
.stagger > *:nth-child(5) { animation-delay: .7s; }
@keyframes rise { to { opacity: 1; transform: none; } }

/* PANELES GENERALES Y BOTONES */
.box-panel {
  background: var(--night);
  border: 3px solid var(--bone);
  box-shadow: 10px 10px 0 var(--purple);
  padding: clamp(1.2rem, 4vw, 2.5rem);
  position: relative;
  margin-bottom: 2rem;
}
.btn {
  background: var(--red);
  color: var(--bone);
  border: 2px solid var(--bone);
  padding: .75rem 1.3rem;
  min-height: 48px;
  font-family: var(--display);
  font-size: .95rem;
  box-shadow: 5px 5px 0 var(--bone);
  transition: transform .15s, box-shadow .15s, background .15s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .5rem;
  text-decoration: none;
}
.btn:hover { transform: translate(2px, 2px); box-shadow: 3px 3px 0 var(--bone); }
.btn.alt { background: var(--neon); color: var(--coal); box-shadow: 5px 5px 0 var(--red); }
.btn[hidden] { display: none; }

/* TRIVIA + RIFF */
.hud { display: flex; justify-content: space-between; gap: 1rem; color: var(--dim); margin-bottom: 1rem; flex-wrap: wrap; }
.bar { height: 8px; background: #2a2f40; margin-bottom: 1.5rem; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--neon); transition: width .4s ease; }
.q { font-size: clamp(1.2rem, 3vw, 1.8rem); margin: 0 0 1rem; font-family: var(--display); line-height: 1.15; }
.riff-btn {
  margin-bottom: 1.2rem;
  background: var(--neon);
  color: var(--coal);
  border: 2px solid var(--bone);
  padding: .6rem 1.1rem;
  font-family: var(--display);
  box-shadow: 4px 4px 0 var(--purple);
}
.opts { display: grid; gap: .7rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.opt {
  background: transparent;
  border: 2px solid var(--bone);
  padding: .9rem 1rem;
  min-height: 48px;
  text-align: left;
  transition: transform .15s, background .15s, box-shadow .15s;
}
.opt:hover:not(:disabled) { background: var(--bone); color: var(--coal); transform: translate(-3px, -3px); box-shadow: 4px 4px 0 var(--red); }
.opt:disabled { cursor: default; pointer-events: none; opacity: .75; }
.opt.ok { background: var(--neon); color: var(--coal); border-color: var(--neon); opacity: 1; animation: pulse .5s; }
.opt.bad { background: var(--red); color: var(--bone); border-color: var(--red); opacity: 1; animation: shake .4s; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.fb { min-height: 3.2rem; margin: 1.2rem 0 .5rem; font-size: 1.1rem; }
.fb.ok { color: var(--neon); }
.fb.bad { color: var(--red); }
.result h3 { font-size: clamp(2rem, 7vw, 4rem); color: var(--neon); margin: .5rem 0 1rem; }
.score { font-family: var(--display); font-size: clamp(3rem, 12vw, 7rem); line-height: 1; }

/* PREMIOS */
.prize { margin-top: 2.5rem; border: 3px dashed var(--neon); padding: clamp(1rem, 3vw, 2rem); }
#prize-st { border-color: var(--red); }
.prize h3 { font-size: clamp(1.8rem
